; [Matchmaking.ini] - Casual matchmaking configuration
;
; The map pool and the game rules (credits, speed, short game, ...) of a mode are
; set on its ladder on the ladder API server, so all players use the same maps and
; rules and the client shows the current map pool.
;
; [How to add a mode]
; 1. Add the mode id under [MatchmakingModes], e.g. 5=MyMode
; 2. Create a [MyMode] section with:
;      Ladder=       abbreviation of the casual ladder on the server (required)
;      UIName=       name shown in the mode list
;      Description=  text shown for the mode, use @ for a line break

[Matchmaking]
Enabled=True
ApiUrl=https://ladder.cncnet.org
DefaultSide=0

[MatchmakingModes]
0=1v1
1=2v2
2=3v3
3=4v4

[1v1]
Ladder=yr-casual-1v1
UIName=1v1 - Solo Duel
Description=Two players. One player gets a random Allied country and the other a random Soviet country.

[2v2]
Ladder=yr-casual-2v2
UIName=2v2 - Team Match
Description=Four players in two teams. Each team has one Allied and one Soviet player.

[3v3]
Ladder=yr-casual-3v3
UIName=3v3 - Faction War
Description=Six players in two teams: one Allied team against one Soviet team.

[4v4]
Ladder=yr-casual-4v4
UIName=4v4 - Team Battle
Description=Eight players in two teams. Each team has two Allied and two Soviet players.
